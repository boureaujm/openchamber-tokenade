<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tokenade</title>
<style>
:root {
  --tk-bg: var(--surface-background, var(--oc-bg, #0a0e13));
  --tk-surface: var(--surface-elevated, var(--oc-elevated, #121821));
  --tk-surface-quiet: #0e141c;
  --tk-surface-quiet: color-mix(in srgb, var(--tk-bg) 68%, var(--tk-surface));
  --tk-fg: var(--surface-foreground, var(--oc-fg, #e6edf3));
  --tk-muted: var(--surface-muted-foreground, var(--oc-muted, #8b98a5));
  --tk-border: var(--interactive-border, var(--oc-border, #1f2933));
--tk-theme-accent: var(--status-success, var(--oc-success, #3ddc97));
--tk-accent: var(--tk-theme-accent);
  --tk-accent-soft: #0f2219;
  --tk-accent-soft: color-mix(in srgb, var(--tk-accent) 11%, var(--tk-surface));
  --tk-warning: var(--status-warning, var(--oc-warning, #d6a54e));
  --tk-error: var(--status-error, var(--oc-error, #f06b6b));
}
:root[data-oc-theme="light"] {
  --tk-theme-accent: #c25e0c;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: var(--tk-bg); color: var(--tk-fg); font: 0.875rem/1.45 var(--font-sans, var(--oc-font, Inter, system-ui, sans-serif)); }
button { color: inherit; font: inherit; }
.dashboard { container: tokenade / inline-size; display: flex; flex-direction: column; gap: 14px; width: min(100%, 1440px); margin: 0 auto; }
.dashboard-header, .brand, .header-actions { display: flex; align-items: center; }
.dashboard-header { justify-content: space-between; gap: 16px; }
.brand { gap: 12px; min-width: 0; }
.brand-mark { display: grid; place-items: center; width: 36px; height: 36px; flex: 0 0 auto; color: var(--tk-accent); background: var(--tk-accent-soft); border: 1px solid color-mix(in srgb, var(--tk-accent) 35%, var(--tk-border)); border-radius: 10px; }
.brand-mark svg { width: 20px; height: 20px; }
.heading { min-width: 0; }
h1 { margin: 0; font-size: 1.06rem; font-weight: 600; line-height: 1.25; letter-spacing: -.02em; }
.subtitle { margin: 3px 0 0; color: var(--tk-muted); font-size: .78rem; }
.header-actions { justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.service-status { display: inline-flex; align-items: center; gap: 7px; color: var(--tk-muted); font-size: .75rem; white-space: nowrap; }
.service-status-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--tk-muted); }
.service-status[data-state="ready"] .service-status-dot { background: var(--tk-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tk-accent) 16%, transparent); }
.service-status[data-state="starting"] .service-status-dot { background: var(--tk-warning); }
.service-status[data-state="stopped"] .service-status-dot, .service-status[data-state="failed"] .service-status-dot { background: var(--tk-error); }
.refresh { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 7px 12px; border: 1px solid var(--tk-border); border-radius: 9px; background: var(--tk-surface); color: var(--tk-fg); cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease, opacity 120ms ease; }
.refresh svg { width: 17px; height: 17px; color: var(--tk-muted); }
.refresh:hover:not(:disabled) { background: color-mix(in srgb, var(--tk-surface) 78%, var(--tk-fg)); border-color: color-mix(in srgb, var(--tk-border) 65%, var(--tk-fg)); }
.refresh:focus-visible { outline: 2px solid var(--interactive-focus-ring, var(--oc-focus, var(--tk-accent))); outline-offset: 2px; }
.refresh:disabled { opacity: .6; cursor: wait; }
.settings-panel { display: grid; gap: 12px; padding: 14px; border: 1px solid var(--tk-border); border-radius: 12px; background: var(--tk-surface); }
.settings-panel[hidden] { display: none; }
.settings-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
.settings-field { display: grid; min-width: 0; gap: 6px; color: var(--tk-muted); font-size: .78rem; }
.settings-field input { width: 100%; min-width: 0; min-height: 38px; padding: 7px 9px; border: 1px solid var(--tk-border); border-radius: 8px; background: var(--tk-bg); color: var(--tk-fg); font: inherit; }
.settings-field input[type="number"] { width: 8rem; max-width: 100%; }
.color-control { position: relative; width: max-content; }
.color-swatch { width: 44px; height: 38px; padding: 4px; border: 1px solid var(--tk-border); border-radius: 8px; cursor: pointer; }
.color-picker { position: absolute; z-index: 10; inset-block-start: calc(100% + 8px); inset-inline-start: 0; display: grid; gap: 10px; width: min(230px, calc(100vw - 32px)); padding: 12px; border: 1px solid var(--tk-border); border-radius: 10px; background: var(--tk-surface); box-shadow: 0 8px 24px rgb(0 0 0 / 18%); }
.color-picker[hidden] { display: none; }
.color-picker h3 { margin: 0; font-size: .82rem; font-weight: 600; }
.color-picker input[type="color"] { width: 68px; height: 42px; min-height: 0; padding: 4px; cursor: pointer; }
.color-picker-actions { display: flex; justify-content: flex-end; gap: 8px; }
.color-picker-actions button { min-height: 34px; padding: 5px 10px; border: 1px solid var(--tk-border); border-radius: 7px; background: var(--tk-surface); cursor: pointer; }
.color-picker-actions .accept-color { border-color: color-mix(in srgb, var(--tk-accent) 50%, var(--tk-border)); color: var(--tk-accent); }
.settings-field input:focus-visible, .settings-panel button:focus-visible { outline: 2px solid var(--interactive-focus-ring, var(--oc-focus, var(--tk-accent))); outline-offset: 2px; }
.settings-message { margin: 0; color: var(--tk-error); font-size: .78rem; }
.settings-message:empty { display: none; }
.settings-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.settings-actions button { min-height: 36px; padding: 6px 11px; border: 1px solid var(--tk-border); border-radius: 8px; background: var(--tk-surface); cursor: pointer; }
.settings-actions button:hover { background: color-mix(in srgb, var(--tk-surface) 78%, var(--tk-fg)); }
.settings-actions .save-settings { border-color: color-mix(in srgb, var(--tk-accent) 50%, var(--tk-border)); color: var(--tk-accent); }
.privilege { margin: 0; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--tk-warning) 28%, var(--tk-border)); border-inline-start: 3px solid var(--tk-warning); border-radius: 9px; background: var(--tk-surface); color: var(--tk-muted); font-size: .8rem; }
.status:empty { display: none; }
.notice, .stale { margin: 0 0 8px; padding: 9px 12px; border: 1px solid var(--tk-border); border-radius: 9px; background: var(--tk-surface); }
.notice:last-child, .stale:last-child { margin-bottom: 0; }
.updated { margin: 0 0 8px; color: var(--tk-muted); font-size: .76rem; }
.notice.error { color: var(--tk-error); border-color: color-mix(in srgb, var(--tk-error) 35%, var(--tk-border)); }
.notice.warning, .stale { color: var(--tk-warning); }
.overview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.hero-card { min-width: 0; padding: 18px 20px; border: 1px solid var(--tk-border); border-radius: 14px; background: var(--tk-surface); }
.hero-savings { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 8px; overflow: hidden; }
.hero-savings::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--tk-accent); content: ""; }
.hero-copy { min-width: 0; }
.eyebrow { display: block; color: var(--tk-muted); font-size: .75rem; font-weight: 600; letter-spacing: .04em; }
.hero-value { display: block; margin-top: 3px; color: var(--tk-accent); font: 600 clamp(2rem, 6cqi, 2.75rem)/1.08 var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-comparison { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin: 5px 0 0; color: var(--tk-muted); font-size: .78rem; }
.comparison-value { color: var(--tk-fg); font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); font-variant-numeric: tabular-nums; }
.comparison-arrow { color: var(--tk-muted); }
.comparison-caption { margin-inline-start: 2px; }
.hero-rate { display: flex; align-items: center; gap: 18px; }
.savings-ring { position: relative; width: 88px; height: 88px; flex: 0 0 auto; }
.savings-ring svg { display: block; width: 100%; height: 100%; }
.ring-track, .ring-value { fill: none; stroke-width: 8; }
.ring-track { stroke: var(--tk-border); }
.ring-value { stroke: var(--tk-accent); stroke-linecap: round; }
.ring-label { position: absolute; inset: 0; display: grid; place-items: center; font: 600 .98rem/1 var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); font-variant-numeric: tabular-nums; }
.rate-caption { margin: 4px 0 0; color: var(--tk-muted); font-size: .78rem; }
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { display: flex; min-width: 0; flex-direction: column; gap: 5px; padding: 12px 14px; border: 1px solid var(--tk-border); border-radius: 12px; background: var(--tk-surface); }
.metric-label { color: var(--tk-muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric-value { display: block; overflow-wrap: anywhere; font: 500 1.08rem/1.25 var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); font-variant-numeric: tabular-nums; }
.breakdowns { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.breakdown { min-width: 0; padding: 16px 18px; border: 1px solid var(--tk-border); border-radius: 14px; background: var(--tk-surface); }
.breakdown-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
h2 { margin: 0; font-size: .9rem; font-weight: 600; }
.breakdown-count { color: var(--tk-muted); font: 500 .72rem/1 var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); }
.breakdown-list { margin: 0; padding: 0; list-style: none; }
.breakdown-row { padding: 10px 0; border-top: 1px solid var(--tk-border); }
.breakdown-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.breakdown-name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.breakdown-values { color: var(--tk-muted); text-align: right; font-size: .75rem; font-variant-numeric: tabular-nums; }
.breakdown-track { display: block; height: 4px; margin-top: 8px; overflow: hidden; border-radius: 4px; background: var(--tk-surface-quiet); }
.breakdown-fill { display: block; height: 100%; border-radius: inherit; background: var(--tk-accent); }
.breakdown-row:first-child { border-top: 0; }
@container tokenade (min-width: 560px) { .overview { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@container tokenade (min-width: 900px) { .summary { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@container tokenade (max-width: 560px) { .color-picker { inset-inline-start: auto; inset-inline-end: 0; } }
@container tokenade (max-width: 420px) { .color-picker { inset-inline-start: 0; inset-inline-end: auto; } .settings-fields { grid-template-columns: minmax(0, 1fr); } .settings-actions { justify-content: stretch; } .settings-actions button { flex: 1 1 auto; } }
@media (max-width: 360px) { body { padding: 12px; } .dashboard { gap: 12px; } .dashboard-header { align-items: flex-start; } .brand { gap: 9px; } .brand-mark { width: 32px; height: 32px; } .refresh { width: 38px; height: 38px; padding: 0; } .refresh span { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; } .hero-card { padding: 14px; } .hero-value { font-size: 1.8rem; } .summary { gap: 8px; } .metric { padding: 10px; } .breakdown { padding: 13px; } .breakdown-meta { display: block; } .breakdown-values { display: block; margin-top: 3px; text-align: left; } }
</style>
  </head>
  <body>
    <main id="app" aria-label="Tokenade"></main>
    <script src="./main.js"></script>
  </body>
</html>
